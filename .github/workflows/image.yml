name: image

# Publishes ghcr.io/zacxdev/muster-clankmail on a vX.Y.Z tag push, and only then.
# The image tag is the version without the `v` (v0.1.0 -> 0.1.0).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: tag matches Version
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          code=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/clankmailplugin/plugin.go)
          if [ -z "$code" ]; then
            echo "::error::no 'const Version = \"...\"' line in internal/clankmailplugin/plugin.go"
            exit 1
          fi
          if [ "$version" != "$code" ]; then
            echo "::error::tag ${REF} is version ${version}, but plugin.go says Version = ${code}"
            exit 1
          fi
          echo "tag ${REF} matches Version ${code}"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.source=https://github.com/ZacxDev/muster-clankmail \
            -t "ghcr.io/zacxdev/muster-clankmail:${version}" \
            --push .
