name: image

# Publishes ghcr.io/zacxdev/muster-clankmail on a vX.Y.Z tag push, and only then.
# The image tag is the version without the `v` (v0.1.0 -> 0.1.0).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        env:
          REF: ${{ github.ref_name }}
        run: |
          version="${REF#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/zacxdev/muster-clankmail:${version}" \
            --push .
